<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前情跳过旅程 · Skip Journey V2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #EDEAE4;
      --color-ink:     #2A2E38;
      --color-muted:   #607887;
      --font-sans:     "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif:    "Noto Serif SC", "Songti SC", serif;
      --font-mono:     "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1180px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 2.2vw + 0.7rem, 1.95rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.4rem;
      line-height: 1.45;
    }
    svg { width: 100%; min-width: 980px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User journey · ART-PROLOGUE-SHOT-LANG-V2</p>
    <h1>跳过旅程 · 任意时刻 Skip → B0</h1>
    <p class="sub">完整观看与中途跳过汇合到同一玩法入口；跳过瞬间不响铃、不重开 Alert</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sj-title sj-desc">
        <title id="sj-title">前情跳过旅程图</title>
        <desc id="sj-desc">五阶段：默认开场、观看中、可选跳过、淡出、进入 B0。情感曲线在跳过时短暂下压后进入可控观察。</desc>
        <defs>
          <marker id="sj-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#607887"/></marker>
          <pattern id="sj-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.85" fill="rgba(42,46,56,0.08)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#EDEAE4"/>
        <rect width="100%" height="100%" fill="url(#sj-dots)" opacity="0.45"/>

        <!-- Stage headers: 5 cols, left margin 64, col 168, gutter 20 -->
        <!-- col centers: 64+84=148, 252+84=336, 440+84=524, 628+84=712, 816+84=900 -->
        <text x="148" y="48" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#607887">STAGE 1</text>
        <text x="148" y="68" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">默认开场</text>

        <text x="336" y="48" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#607887">STAGE 2</text>
        <text x="336" y="68" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">观看 P 镜</text>

        <text x="524" y="48" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#9D5048">STAGE 3</text>
        <text x="524" y="68" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">任意 Skip</text>

        <text x="712" y="48" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#607887">STAGE 4</text>
        <text x="712" y="68" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">淡出</text>

        <text x="900" y="48" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#607887">STAGE 5</text>
        <text x="900" y="68" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">进入 B0</text>

        <!-- Sentiment band -->
        <text x="56" y="118" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">HIGH</text>
        <line x1="64" y1="114" x2="960" y2="114" stroke="rgba(42,46,56,0.10)" stroke-width="1"/>
        <text x="56" y="174" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">NEUTRAL</text>
        <line x1="64" y1="170" x2="960" y2="170" stroke="rgba(42,46,56,0.10)" stroke-width="1"/>
        <text x="56" y="230" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">LOW</text>
        <line x1="64" y1="226" x2="960" y2="226" stroke="rgba(42,46,56,0.10)" stroke-width="1"/>

        <!-- Sentiment curve: HIGH, MED-HIGH, LOW(trough skip), NEUTRAL, MED-HIGH -->
        <!-- y: HIGH=114, MED-HIGH=142, NEUTRAL=170, MED-LOW=198, LOW=226 -->
        <polyline points="148,142 336,130 524,226 712,170 900,142" fill="none" stroke="#607887" stroke-width="1.5"/>
        <!-- trough incoming accent segment -->
        <polyline points="336,130 524,226" fill="none" stroke="#9D5048" stroke-width="2"/>
        <circle cx="148" cy="142" r="5" fill="#607887"/>
        <circle cx="336" cy="130" r="5" fill="#607887"/>
        <circle cx="524" cy="226" r="6" fill="#9D5048"/>
        <circle cx="712" cy="170" r="5" fill="#607887"/>
        <circle cx="900" cy="142" r="5" fill="#607887"/>

        <!-- Pain marker under skip -->
        <rect x="468" y="248" width="112" height="22" rx="2" fill="rgba(157,80,72,0.08)" stroke="#9D5048" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="524" y="263" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#9D5048">不强迫看完微笑</text>

        <!-- Divider -->
        <line x1="64" y1="288" x2="960" y2="288" stroke="rgba(42,46,56,0.12)" stroke-width="1"/>

        <!-- ACTIONS row -->
        <text x="56" y="318" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">ACTIONS</text>
        <text x="148" y="318" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">自动播标题</text>
        <text x="336" y="318" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">看雨→线索→微笑</text>
        <text x="524" y="318" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">按 Skip</text>
        <text x="712" y="318" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">等淡出 0.4–0.8s</text>
        <text x="900" y="318" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">接手观察窗</text>

        <line x1="64" y1="340" x2="960" y2="340" stroke="rgba(42,46,56,0.12)" stroke-width="1"/>

        <!-- TOUCHPOINTS -->
        <text x="56" y="370" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">TOUCH</text>
        <text x="148" y="370" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">Timeline 默认</text>
        <text x="336" y="370" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">P01–P08 画面</text>
        <text x="524" y="370" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">键位 / 触控提示</text>
        <text x="712" y="370" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">全屏淡出层</text>
        <text x="900" y="370" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">B0 玩法相机</text>

        <line x1="64" y1="392" x2="960" y2="392" stroke="rgba(42,46,56,0.12)" stroke-width="1"/>

        <!-- RULES row -->
        <text x="56" y="422" text-anchor="end" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">RULES</text>
        <text x="148" y="422" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">可跳过始终可见</text>
        <text x="336" y="422" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">提示不挡主体</text>
        <text x="524" y="422" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#9D5048">跳过瞬间不响铃</text>
        <text x="712" y="422" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">不播加速剪辑</text>
        <text x="900" y="422" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">无 Alert UI</text>

        <!-- Two paths callout -->
        <rect x="64" y="448" width="896" height="54" rx="4" fill="#E8ECEF" stroke="#607887" stroke-width="1"/>
        <text x="80" y="470" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">双路径汇合</text>
        <text x="80" y="490" font-family="var(--font-mono), monospace" font-size="10" fill="#607887">路径 A：看完 P09 → B0　|　路径 B：任意镜 Skip → 淡出 → B0　|　状态相同：已建立标题情绪，不解锁额外剧情</text>

        <!-- Legend -->
        <line x1="64" y1="518" x2="960" y2="518" stroke="rgba(42,46,56,0.12)" stroke-width="1"/>
        <line x1="80" y1="538" x2="110" y2="538" stroke="#607887" stroke-width="1.5"/>
        <text x="118" y="542" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">情绪曲线</text>
        <line x1="220" y1="538" x2="250" y2="538" stroke="#9D5048" stroke-width="2"/>
        <circle cx="265" cy="538" r="5" fill="#9D5048"/>
        <text x="278" y="542" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">Skip 槽点（可主动离场）</text>
        <rect x="460" y="530" width="18" height="14" rx="2" fill="rgba(157,80,72,0.08)" stroke="#9D5048" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="486" y="542" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">摩擦标注</text>
      </svg>
    </div>
  </div>
</body>
</html>
