<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前情《还没响的铃》· 叙事时间线 V2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #EDEAE4;
      --color-ink:     #2A2E38;
      --color-muted:   #607887;
      --color-accent:  #9D5048;
      --color-metal:   #B78C48;
      --color-cold:    #607887;
      --font-sans:     "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-serif:    "Noto Serif SC", "Songti SC", "Instrument Serif", serif;
      --font-mono:     "Geist Mono", "IBM Plex Mono", ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1180px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 2.2vw + 0.7rem, 1.95rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.35rem;
    }
    .sub {
      font-size: 0.85rem;
      color: var(--color-muted);
      margin-bottom: 1.4rem;
      line-height: 1.45;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · ART-PROLOGUE-SHOT-LANG-V2</p>
    <h1>还没响的铃 · 叙事时间线</h1>
    <p class="sub">日常雨 → 秩序裂缝（标识/线索）→ uncanny 微笑 → 内心独白 → 进玩法 B0 · 三拍高光色标</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tl-title tl-desc">
        <title id="tl-title">前情叙事时间线：雨到玩法</title>
        <desc id="tl-desc">五段弧：日常雨、诡异线索、监考微笑、内心独白、进入 B0 开场观察窗。高光节点用冷窗蓝灰与印章红。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#607887"/></marker>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.85" fill="rgba(42,46,56,0.08)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#EDEAE4"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>

        <!-- Phase bands -->
        <rect x="48" y="72" width="168" height="56" rx="4" fill="#E4E9EC" stroke="#607887" stroke-width="1.25"/>
        <rect x="232" y="72" width="168" height="56" rx="4" fill="#F3EEE8" stroke="#B78C48" stroke-width="1.25"/>
        <rect x="416" y="72" width="168" height="56" rx="4" fill="#F5EBE9" stroke="#9D5048" stroke-width="1.5"/>
        <rect x="600" y="72" width="168" height="56" rx="4" fill="#EDEAE4" stroke="rgba(42,46,56,0.22)" stroke-width="1"/>
        <rect x="784" y="72" width="168" height="56" rx="4" fill="#E8ECEF" stroke="#607887" stroke-width="1"/>

        <text x="132" y="96" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.12em" fill="#607887">PHASE 1</text>
        <text x="132" y="114" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="13" font-weight="600" fill="#2A2E38">日常雨</text>

        <text x="316" y="96" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.12em" fill="#B78C48">PHASE 2</text>
        <text x="316" y="114" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="13" font-weight="600" fill="#2A2E38">秩序裂缝</text>

        <text x="500" y="96" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.12em" fill="#9D5048">PHASE 3</text>
        <text x="500" y="114" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="13" font-weight="600" fill="#2A2E38">uncanny 微笑</text>

        <text x="684" y="96" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.12em" fill="#607887">PHASE 4</text>
        <text x="684" y="114" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="13" font-weight="600" fill="#2A2E38">内心独白</text>

        <text x="868" y="96" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" font-weight="500" letter-spacing="0.12em" fill="#607887">PHASE 5</text>
        <text x="868" y="114" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="13" font-weight="600" fill="#2A2E38">进玩法 B0</text>

        <!-- Baseline -->
        <line x1="70" y1="260" x2="930" y2="260" stroke="rgba(96,120,135,0.45)" stroke-width="1"/>

        <!-- Events (approx cumulative seconds) -->
        <!-- P01 0s -->
        <line x1="100" y1="260" x2="100" y2="198" stroke="#607887" stroke-width="1"/>
        <circle cx="100" cy="260" r="7" fill="#607887"/>
        <text x="100" y="178" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#607887">P01 ★ 窗外大雨</text>
        <text x="100" y="192" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">冷窗 · 雨丝 · 倒影</text>
        <text x="100" y="290" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">0s</text>

        <!-- P02 -->
        <line x1="190" y1="260" x2="190" y2="312" stroke="rgba(42,46,56,0.28)" stroke-width="1"/>
        <circle cx="190" cy="260" r="4" fill="#2A2E38"/>
        <text x="190" y="328" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">P02 倒影</text>
        <text x="190" y="302" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~3.5s</text>

        <!-- P03 clue -->
        <line x1="300" y1="260" x2="300" y2="198" stroke="#B78C48" stroke-width="1"/>
        <circle cx="300" cy="260" r="7" fill="#B78C48"/>
        <text x="300" y="178" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#B78C48">P03 ★ 诡异标识</text>
        <text x="300" y="192" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">校牌歪 · 可读</text>
        <text x="300" y="290" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~6s</text>

        <!-- P04-P05 -->
        <line x1="400" y1="260" x2="400" y2="312" stroke="rgba(157,80,72,0.55)" stroke-width="1"/>
        <circle cx="400" cy="260" r="5" fill="#9D5048"/>
        <text x="400" y="328" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#9D5048">P04–P05 线索</text>
        <text x="400" y="342" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">笔迹 · 印章</text>
        <text x="400" y="302" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~9s</text>

        <!-- P06 -->
        <line x1="520" y1="260" x2="520" y2="198" stroke="rgba(42,46,56,0.28)" stroke-width="1"/>
        <circle cx="520" cy="260" r="4" fill="#2A2E38"/>
        <text x="520" y="178" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">P06 入画</text>
        <text x="520" y="192" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">大衣剪影</text>
        <text x="520" y="290" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~14s</text>

        <!-- P07 smile -->
        <line x1="640" y1="260" x2="640" y2="198" stroke="#9D5048" stroke-width="1.25"/>
        <circle cx="640" cy="260" r="7" fill="#9D5048"/>
        <text x="640" y="178" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#9D5048">P07 ★ 监考微笑</text>
        <text x="640" y="192" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">眼镜反光 · 不到眼</text>
        <text x="640" y="290" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~17s</text>

        <!-- P08 VO -->
        <line x1="760" y1="260" x2="760" y2="312" stroke="rgba(42,46,56,0.28)" stroke-width="1"/>
        <circle cx="760" cy="260" r="4" fill="#2A2E38"/>
        <text x="760" y="328" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="11" font-weight="600" fill="#2A2E38">P08 独白落点</text>
        <text x="760" y="342" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">铃还没响</text>
        <text x="760" y="302" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~21s</text>

        <!-- P09 B0 -->
        <line x1="880" y1="260" x2="880" y2="198" stroke="#607887" stroke-width="1"/>
        <circle cx="880" cy="260" r="6" fill="#EDEAE4" stroke="#607887" stroke-width="2"/>
        <text x="880" y="178" text-anchor="middle" font-family="var(--font-sans), sans-serif" font-size="12" font-weight="600" fill="#2A2E38">P09 → B0</text>
        <text x="880" y="192" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="9" fill="#607887">开场观察窗</text>
        <text x="880" y="290" text-anchor="middle" font-family="var(--font-mono), monospace" font-size="8" fill="#607887">~24s</text>

        <!-- Callout -->
        <text x="70" y="400" font-family="var(--font-serif), serif" font-size="14" font-style="italic" fill="#607887">任意时刻 Skip → 淡出进 B0；完整弧约 22–28s（剪辑窗）</text>

        <!-- Legend -->
        <line x1="70" y1="418" x2="930" y2="418" stroke="rgba(42,46,56,0.12)" stroke-width="1"/>
        <circle cx="90" cy="438" r="5" fill="#607887"/>
        <text x="102" y="442" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">雨窗高光 #607887</text>
        <circle cx="280" cy="438" r="5" fill="#B78C48"/>
        <text x="292" y="442" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">线索 / 金属强调 #B78C48</text>
        <circle cx="520" cy="438" r="5" fill="#9D5048"/>
        <text x="532" y="442" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">微笑 / 印章 #9D5048</text>
        <circle cx="740" cy="438" r="4" fill="#2A2E38"/>
        <text x="752" y="442" font-family="var(--font-mono), monospace" font-size="9" fill="#2A2E38">过渡镜</text>
      </svg>
    </div>
  </div>
</body>
</html>
